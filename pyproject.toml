[project]
name = "invoice-extractor"
version = "1.0.0"
description = "Turn invoices and receipts (PDF or photo) into a checked Excel/CSV spreadsheet with Claude"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["samples/make_samples.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
